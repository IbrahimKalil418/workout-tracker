<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>
    <div class="container">
    <h1>Workout Tracker</h1>
    <h2>My Dashboard</h2>

<div class="dashboard">

    <div class="stat-card">

        <h3>Total Workouts</h3>

        <p id="totalWorkouts">0</p>

    </div>

    <div class="stat-card">

        <h3>Total Minutes</h3>

        <p id="totalMinutes">0</p>

    </div>

    <div class="stat-card">

        <h3>This Week</h3>

        <p id="weeklyWorkouts">0</p>

    </div>

</div>
    <input type="text" id="workoutName"placeholder="Workout Name">
    <input type="number" id="workoutDuration" placeholder="Duration (minutes)">
<button type="button" id="addWorkoutBtn">Add Workout</button>
<ul id="workoutList"></ul>
</div>
<script src="script.js?v=2"></script>
</body>
</html>
